<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/realjolie.jpeg" />

    <!-- SEO principal -->
    <title>Jolie Vie | Libretas y accesorios personalizados en Costa Rica</title>
    <meta name="description" content="Libretas, agendas y accesorios de cuero personalizados hechos en Costa Rica. Enviamos por Correos de Costa Rica y Uber Flash. ¡Hacé tu pedido en línea!" />
    <meta name="keywords" content="libretas personalizadas Costa Rica, agendas de cuero Costa Rica, accesorios personalizados, cuero genuino, Jolie Vie, papelería Costa Rica" />
    <meta name="author" content="Jolie Vie" />
    <link rel="canonical" href="https://jolieviecr.com/" />

    <!-- Open Graph (WhatsApp, Facebook, Instagram) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jolieviecr.com/" />
    <meta property="og:title" content="Jolie Vie | Libretas y accesorios personalizados en Costa Rica" />
    <meta property="og:description" content="Libretas, agendas y accesorios de cuero personalizados hechos en Costa Rica. ¡Hacé tu pedido en línea!" />
    <meta property="og:image" content="https://jolieviecr.com/portada1.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_CR" />
    <meta property="og:site_name" content="Jolie Vie" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jolie Vie | Libretas y accesorios personalizados en Costa Rica" />
    <meta name="twitter:description" content="Libretas, agendas y accesorios de cuero personalizados hechos en Costa Rica." />
    <meta name="twitter:image" content="https://jolieviecr.com/portada1.jpg" />

    <!-- Google puede indexar -->
    <meta name="robots" content="index, follow" />

    <!-- LCP hero image — discovered by the browser before React ever renders the <img> -->
    <link rel="preload" as="image" href="/portada1.jpg" fetchpriority="high" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Great+Vibes&family=Alegreya+Sans+SC:wght@400;700&family=Alegreya+Sans:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
